<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - Order of Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .size-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .qr-display {
            margin-top: 30px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 12px;
            text-align: center;
            display: none;
        }

        .qr-display.active {
            display: block;
        }

        #qrcode {
            display: inline-block;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .url-display {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            word-break: break-all;
            font-family: monospace;
            color: #667eea;
            font-weight: 600;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .secondary-btn {
            background: #28a745;
        }

        .secondary-btn:hover {
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 5px;
            font-size: 0.9em;
            color: #333;
        }

        .info-box strong {
            color: #2196F3;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 1.5em;
            }

            .size-inputs,
            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔲 QR Code Generator</h1>
        <p class="subtitle">Create a QR code for your Order of Service page</p>

        <div class="info-box">
            <strong>💡 Tip:</strong> Once generated, the QR code will always point to the same URL. You can update your Order of Service content anytime without changing the QR code!
        </div>

        <form id="qrForm">
            <div class="input-group">
                <label for="url">Website URL *</label>
                <input 
                    type="text" 
                    id="url" 
                    placeholder="https://yourdomain.com/index.html or file path"
                    required
                >
            </div>

            <div class="input-group">
                <label>QR Code Size (pixels)</label>
                <div class="size-inputs">
                    <div>
                        <input 
                            type="number" 
                            id="width" 
                            placeholder="Width" 
                            value="300"
                            min="100"
                            max="1000"
                        >
                    </div>
                    <div>
                        <input 
                            type="number" 
                            id="height" 
                            placeholder="Height" 
                            value="300"
                            min="100"
                            max="1000"
                        >
                    </div>
                </div>
            </div>

            <button type="submit">Generate QR Code</button>
        </form>

        <div id="qrDisplay" class="qr-display">
            <div id="qrcode"></div>
            <div class="url-display" id="urlDisplay"></div>
            <div class="button-group">
                <button type="button" id="downloadBtn" class="secondary-btn">Download QR Code</button>
                <button type="button" id="printBtn">Print QR Code</button>
            </div>
        </div>
    </div>

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script>
        let qrcode = null;

        // Form submission
        document.getElementById('qrForm').addEventListener('submit', function(e) {
            e.preventDefault();
            generateQRCode();
        });

        function generateQRCode() {
            const url = document.getElementById('url').value.trim();
            const width = parseInt(document.getElementById('width').value) || 300;
            const height = parseInt(document.getElementById('height').value) || 300;

            if (!url) {
                alert('Please enter a URL');
                return;
            }

            // Clear previous QR code
            const qrcodeContainer = document.getElementById('qrcode');
            qrcodeContainer.innerHTML = '';

            // Generate new QR code
            qrcode = new QRCode(qrcodeContainer, {
                text: url,
                width: width,
                height: height,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            // Display the QR code section
            document.getElementById('qrDisplay').classList.add('active');
            document.getElementById('urlDisplay').textContent = `URL: ${url}`;

            // Scroll to QR code
            setTimeout(() => {
                document.getElementById('qrDisplay').scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'nearest' 
                });
            }, 100);
        }

        // Download QR Code
        document.getElementById('downloadBtn').addEventListener('click', function() {
            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) {
                alert('Please generate a QR code first');
                return;
            }

            // Create download link
            const url = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = 'order-of-service-qr-code.png';
            link.href = url;
            link.click();
        });

        // Print QR Code
        document.getElementById('printBtn').addEventListener('click', function() {
            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) {
                alert('Please generate a QR code first');
                return;
            }

            // Create print window
            const printWindow = window.open('', '_blank');
            const url = document.getElementById('url').value;
            
            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>QR Code - Order of Service</title>
                    <style>
                        body {
                            font-family: Arial, sans-serif;
                            text-align: center;
                            padding: 40px;
                        }
                        h1 {
                            margin-bottom: 20px;
                        }
                        img {
                            margin: 20px 0;
                            border: 2px solid #333;
                            padding: 20px;
                        }
                        .url {
                            margin-top: 20px;
                            font-size: 12px;
                            word-break: break-all;
                        }
                        @media print {
                            body {
                                padding: 20px;
                            }
                        }
                    </style>
                </head>
                <body>
                    <h1>Harvest Thanksgiving Service</h1>
                    <h2>Order of Service QR Code</h2>
                    <img src="${canvas.toDataURL()}" />
                    <p class="url">${url}</p>
                    <p>Scan this code to view the Order of Service</p>
                </body>
                </html>
            `);
            
            printWindow.document.close();
            printWindow.focus();
            
            // Wait for image to load then print
            setTimeout(() => {
                printWindow.print();
            }, 250);
        });

        // Auto-fill local file path on page load
        window.addEventListener('load', function() {
            const currentPath = window.location.href.replace('qr-generator.html', 'index.html');
            if (currentPath.startsWith('file://')) {
                document.getElementById('url').value = currentPath;
            }
        });
    </script>
</body>
</html>
