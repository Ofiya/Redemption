name: Deploy to Azure App Service (QRServer)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'QRServer'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_QRSERVER }}
          package: .
